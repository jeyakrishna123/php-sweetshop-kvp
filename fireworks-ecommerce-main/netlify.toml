# Netlify configuration for SK Bakers E-commerce
# NOTE: Backend is now PHP-based, not Node.js
# Deploy the PHP backend to your hosting provider (Hostinger, etc.)

[build]
  publish = "ecommerce-website/ecommerce-frontend/dist"
  command = "cd ecommerce-website/ecommerce-frontend && npm install && npm run build"
  base = "."

# Catch-all redirect for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Update VITE_API_URL to point to your PHP backend URL
  VITE_API_URL = "https://your-domain.com"
