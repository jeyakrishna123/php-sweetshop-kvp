# Netlify configuration for SK Bakers E-commerce
[build]
  publish = "ecommerce-website/ecommerce-frontend/dist"
  command = "cd ecommerce-website/ecommerce-frontend && npm install && npm run build"
  base = "."
  functions = "netlify/functions"

# API redirects - must come before catch-all
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Catch-all redirect for SPA - must come last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
  VITE_API_URL = ""

[functions]
  node_bundler = "esbuild"
