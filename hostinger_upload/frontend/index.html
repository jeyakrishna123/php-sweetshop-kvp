    <!-- AuthContext Fix -->
    <script>
      // Create AuthContext for the app
      window.AuthContext = {
        user: null,
        loading: false,
        
        register: async function(name, email, phone, password) {
          try {
            const response = await fetch('https://skbakers.com/api/auth?endpoint=register', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                name,
                email,
                phone,
                password,
              }),
            });

            const data = await response.json();

            if (response.ok) {
              return data;
            } else {
              throw new Error(data.message || 'Registration failed');
            }
          } catch (error) {
            throw error;
          }
        },
        
        login: async function(email, password) {
          try {
            const response = await fetch('https://skbakers.com/api/auth?endpoint=login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                email,
                password,
              }),
            });

            const data = await response.json();

            if (response.ok) {
              localStorage.setItem('token', data.data.token);
              this.user = data.data.user;
              return data;
            } else {
              throw new Error(data.message || 'Login failed');
            }
          } catch (error) {
            throw error;
          }
        },
        
        logout: function() {
          localStorage.removeItem('token');
          this.user = null;
        },
        
        getCurrentUser: async function() {
          try {
            const token = localStorage.getItem('token');
            if (!token) return null;

            const response = await fetch('https://skbakers.com/api/auth?endpoint=getCurrentUser', {
              method: 'GET',
              headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
            });

            if (response.ok) {
              const data = await response.json();
              this.user = data.data;
              return data.data;
            } else {
              localStorage.removeItem('token');
              this.user = null;
              return null;
            }
          } catch (error) {
            localStorage.removeItem('token');
            this.user = null;
            return null;
          }
        }
      };
      
      // Make it available globally
      window.useAuth = function() {
        return window.AuthContext;
      };
    </script>

          // Remove any existing loading elements first
          const loadingElements = document.querySelectorAll('[class*="loading"], [id*="loading"], .spinner, .loader');
          loadingElements.forEach(el => el.remove());
          
          // Find or create banner container
          let bannerContainer = document.querySelector('.banner-container');
          if (!bannerContainer) {
            // Create banner container if it doesn't exist
            bannerContainer = document.createElement('div');
            bannerContainer.className = 'banner-container';
            bannerContainer.style.cssText = `
              position: relative;
              overflow: visible;
              margin-bottom: 0;
              min-height: 24rem;
              width: 100vw !important;
              max-width: 100vw !important;
              margin-left: calc(-50vw + 50%) !important;
              margin-right: calc(-50vw + 50%) !important;
              z-index: 1;
            `;
            
            // Try multiple insertion points
            const insertionPoints = [
              document.querySelector('main'),
              document.querySelector('#root'),
              document.querySelector('.main-content'),
              document.querySelector('.content'),
              document.body
            ];
            
            for (const point of insertionPoints) {
              if (point) {
                point.insertBefore(bannerContainer, point.firstChild);
                break;
              }
            }

          // Clear existing banners
          bannerContainer.innerHTML = '';
          bannerContainer.style.display = 'block';

            banners.forEach((banner, index) => {
              const bannerElement = createBannerElement(banner, index);

            });
          } else {
            bannerContainer.style.display = 'none';

              <div style="background: #f0f0f0; color: #666; padding: 2rem; text-align: center; border-radius: 8px;">
                <h3>${banner.title || 'Banner'}</h3>
                <p>${banner.subtitle || 'No image available'}</p>
              </div>
            `;
            return bannerDiv;
          }
          
          // Make sure image URL is absolute
          if (imageUrl.startsWith('/')) {
            imageUrl = 'https://skbakers.com' + imageUrl;
          }
          
          const img = document.createElement('img');
          img.src = imageUrl;
          img.alt = banner.title || 'Banner';
          img.className = 'banner-image-wavy';
          img.style.cssText = `
            width: 100%;
            height: 100%;
            object-fit: cover;
            clip-path: polygon(0% 0%, 100% 0%, 100% 95%, 95% 100%, 90% 95%, 85% 100%, 80% 95%, 75% 100%, 70% 95%, 65% 100%, 60% 95%, 55% 100%, 50% 95%, 45% 100%, 40% 95%, 35% 100%, 30% 95%, 25% 100%, 20% 95%, 15% 100%, 10% 95%, 5% 100%, 0% 95%);
            transition: clip-path 0.3s ease;
          `;
          
          // Add click handler if banner has a link
          if (banner.linkUrl) {
            bannerDiv.style.cursor = 'pointer';
            bannerDiv.addEventListener('click', () => {
              window.open(banner.linkUrl, '_blank');
            });
          }
          
          // Add banner text overlay if title exists
          if (banner.title || banner.subtitle) {
            const textOverlay = document.createElement('div');
            textOverlay.style.cssText = `
              position: absolute;
              top: 50%;
              left: 50%;
              transform: translate(-50%, -50%);
              text-align: center;
              color: white;
              z-index: 2;
              background: rgba(0,0,0,0.5);
              padding: 20px;
              border-radius: 10px;
            `;
            
            if (banner.title) {
              const title = document.createElement('h2');
              title.textContent = banner.title;
              title.style.cssText = `
                margin: 0 0 10px 0;
                font-size: 2rem;
                font-weight: bold;
              `;
              textOverlay.appendChild(title);
            }
            
            if (banner.subtitle) {
              const subtitle = document.createElement('p');
              subtitle.textContent = banner.subtitle;
              subtitle.style.cssText = `
                margin: 0;
                font-size: 1.2rem;
              `;
              textOverlay.appendChild(subtitle);
            }
            
            if (banner.buttonText) {
              const button = document.createElement('button');
              button.textContent = banner.buttonText;
              button.style.cssText = `
                margin-top: 15px;
                padding: 10px 20px;
                background: #dc3545;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 1rem;
              `;
              textOverlay.appendChild(button);
            }
            
            bannerDiv.appendChild(textOverlay);
          }
          
          bannerDiv.appendChild(img);
          return bannerDiv;
        }
        
        // Clean up unwanted elements
        function cleanupUnwantedElements() {
          // Remove loading spinners, placeholders, and other unwanted elements
          const unwantedSelectors = [
            '[class*="loading"]',
            '[id*="loading"]',
            '.spinner',
            '.loader',
            '.placeholder',
            '[class*="placeholder"]',
            '.loading-indicator',
            '.loading-overlay'
          ];
          
          unwantedSelectors.forEach(selector => {
            const elements = document.querySelectorAll(selector);
            elements.forEach(el => {
              el.remove();
            });
          });
          
          // Remove any elements with just a white dot (common loading indicator)
          const allElements = document.querySelectorAll('*');
          allElements.forEach(el => {
            if (el.children.length === 0 && 
                el.textContent.trim() === '' && 
                el.style.backgroundColor === 'rgb(128, 128, 128)' || 
                el.style.backgroundColor === '#808080') {
              el.remove();
            }
          });
        }
        
        // Consolidated event handling to prevent duplicates
        let eventHandlersInitialized = false;
        
        function initializeEventHandlers() {
          if (eventHandlersInitialized) {
            return;
          }
          
          eventHandlersInitialized = true;
          
          // Load banners when DOM is ready
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', async () => {
              cleanupUnwantedElements();
              await loadBanners();
            });
          } else {
            cleanupUnwantedElements();
            loadBanners();
          }
          
          // Also load banners on window load
          window.addEventListener('load', async () => {
            cleanupUnwantedElements();
            await loadBanners();
          });
          
          // Load banners after a short delay to ensure React app is ready
          setTimeout(() => {
            loadBanners();
          }, 2000);
          
          // Load banners when user navigates (for SPA behavior)
          window.addEventListener('popstate', () => {
            setTimeout(loadBanners, 500);
          });
        }
        
        // Initialize event handlers
        initializeEventHandlers();
        
        // DEBUG BUTTONS REMOVED FOR PRODUCTION
        // All test/debug buttons have been removed for clean production UI
        // No visible debug elements will appear to users
        
        // Add duplicate form submission prevention
        function preventDuplicateSubmissions() {
          const forms = document.querySelectorAll('form');
          forms.forEach(form => {
            let isSubmitting = false;
            
            form.addEventListener('submit', function(e) {
              if (isSubmitting) {
                e.preventDefault();
                return false;
              }
              
              isSubmitting = true;
              
              // Reset flag after 5 seconds
              setTimeout(() => {
                isSubmitting = false;
              }, 5000);
            });
          });
        }
        
        // Initialize duplicate prevention
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', preventDuplicateSubmissions);
        } else {
          preventDuplicateSubmissions();
        }
      })();
    </script>
    
    <!-- Mobile-specific CSS fixes -->

        .mobile-menu-container {

        @media (max-width: 1024px) {

        input[type="number"], input[type="text"][inputmode="numeric"] {

        /* Force numeric keypad on mobile for OTP inputs */

        /* Prevent horizontal scroll */
        html, body {

        }
        
        /* Mobile-specific button styles */
        button, .btn {

          -moz-appearance: none;
          appearance: none;

      }
      
      /* Touch device optimizations */
      @media (hover: none) and (pointer: coarse) {
        .hover\:bg-gray-100:hover {

        }
        
        .hover\:text-red-600:hover {
          color: inherit;
        }
      }
    </style>
