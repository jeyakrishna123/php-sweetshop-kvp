    <!-- Production Environment Fix - AGGRESSIVE -->
    <script>
      console.log('🔧 FORCING PRODUCTION ENVIRONMENT...');
      
      // Force production environment variables
      window.NODE_ENV = 'production';
      window.VITE_API_URL = 'https://skbakers.com/api';
      window.ENV = 'production';
      window.VITE_ENV = 'production';
      
      // Override process.env if it exists
      if (typeof process !== 'undefined') {
        process.env.NODE_ENV = 'production';
        process.env.VITE_API_URL = 'https://skbakers.com/api';
      }
      
      // AGGRESSIVE fetch override - catch ALL localhost calls
      const originalFetch = window.fetch;
      window.fetch = function(url, options) {
        let newUrl = url;
        
        // Convert any localhost calls to production
        if (typeof url === 'string') {
          if (url.startsWith('http://localhost:8000/api/')) {
            newUrl = url.replace('http://localhost:8000/api/', 'https://skbakers.com/api/');
          } else if (url.startsWith('http://localhost:3000/api/')) {
            newUrl = url.replace('http://localhost:3000/api/', 'https://skbakers.com/api/');
          } else if (url.startsWith('/api/')) {
            newUrl = 'https://skbakers.com' + url;
          } else if (url.includes('localhost') && url.includes('/api/')) {
            newUrl = 'https://skbakers.com/api/';
          }
        }
        
        console.log('🌐 API Request Redirected:', url, '→', newUrl);
        return originalFetch.call(this, newUrl, options);
      };
      
      // Override axios if available
      if (typeof window.axios !== 'undefined') {
        window.axios.defaults.baseURL = 'https://skbakers.com/api';
        console.log('✅ Axios base URL set to production');
      }
      
      // Override XMLHttpRequest as well
      const originalXHR = window.XMLHttpRequest;
      window.XMLHttpRequest = function() {
        const xhr = new originalXHR();
        const originalOpen = xhr.open;
        xhr.open = function(method, url, ...args) {
          let newUrl = url;
          if (typeof url === 'string' && url.includes('localhost')) {
            newUrl = url.replace(/http:\/\/localhost:\d+\/api\//, 'https://skbakers.com/api/');
          }
          console.log('🌐 XHR Request Redirected:', url, '→', newUrl);
          return originalOpen.call(this, method, newUrl, ...args);
        };
        return xhr;
      };
      
      console.log('✅ AGGRESSIVE Production API fix applied');
      console.log('🎯 All API calls will be redirected to https://skbakers.com/api');
      
      // Token refresh mechanism to prevent automatic logoffs
      let isRefreshing = false; // Prevent duplicate refresh calls
      
      function setupTokenRefresh() {
        if (isRefreshing) {
          console.log('🔄 Token refresh already in progress, skipping...');
          return;
        }
        
        const token = localStorage.getItem('token');
        if (token) {
          // Check if token is close to expiry (refresh if less than 1 day left)
          try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            const now = Math.floor(Date.now() / 1000);
            const timeLeft = payload.exp - now;
            
            // If less than 24 hours left, refresh token
            if (timeLeft < 86400) {
              console.log('🔄 Token expiring soon, refreshing...');
              refreshToken();
            }
          } catch (e) {
            console.log('🔄 Invalid token, clearing...');
            localStorage.removeItem('token');
            localStorage.removeItem('user');
          }
        }
      }
      
      // Refresh token function
      async function refreshToken() {
        if (isRefreshing) {
          console.log('🔄 Token refresh already in progress, skipping...');
          return;
        }
        
        isRefreshing = true;
        try {
          const response = await fetch('https://skbakers.com/api/auth/refresh-token', {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + localStorage.getItem('token'),
              'Content-Type': 'application/json'
            }
          });
          
          if (response.ok) {
            const data = await response.json();
            localStorage.setItem('token', data.data.token);
            localStorage.setItem('user', JSON.stringify(data.data.user));
            console.log('✅ Token refreshed successfully');
          } else {
            console.log('❌ Token refresh failed, user needs to login again');
            localStorage.removeItem('token');
            localStorage.removeItem('user');
          }
        } catch (error) {
          console.log('❌ Token refresh error:', error);
        } finally {
          isRefreshing = false;
        }
      }
      
      // Initialize token refresh only once
      if (!window.tokenRefreshInitialized) {
        window.tokenRefreshInitialized = true;
        setupTokenRefresh();
        
        // Refresh token every 12 hours
        setInterval(setupTokenRefresh, 12 * 60 * 60 * 1000);
        console.log('✅ Token refresh mechanism initialized');
      }
      
      // Prevent duplicate logout by checking session storage
      function preventDuplicateLogout() {
        const logoutKey = 'logout_in_progress';
        const isLoggingOut = sessionStorage.getItem(logoutKey);
        
        if (isLoggingOut) {
          console.log('🔄 Logout already in progress, preventing duplicate...');
          return true;
        }
        
        sessionStorage.setItem(logoutKey, 'true');
        
        // Clear the flag after 5 seconds
        setTimeout(() => {
          sessionStorage.removeItem(logoutKey);
          console.log('✅ Logout flag cleared');
        }, 5000);
        
        return false;
      }
      
      // Override logout function to prevent duplicates
      if (window.logout) {
        const originalLogout = window.logout;
        window.logout = function() {
          if (preventDuplicateLogout()) {
            return;
          }
          originalLogout();
        };
      }
    </script>

    <!-- AuthContext Fix -->
    <script>
      // Create AuthContext for the app
      window.AuthContext = {
        user: null,
        loading: false,
        
        register: async function(name, email, phone, password) {
          try {
            console.log('Attempting user registration for:', email);
            
            const response = await fetch('https://skbakers.com/api/auth?endpoint=register', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                name,
                email,
                phone,
                password,
              }),
            });

            const data = await response.json();

            if (response.ok) {
              console.log('Registration successful:', data);
              return data;
            } else {
              console.error('Registration failed:', data);
              throw new Error(data.message || 'Registration failed');
            }
          } catch (error) {
            console.error('Registration error:', error);
            throw error;
          }
        },
        
        login: async function(email, password) {
          try {
            const response = await fetch('https://skbakers.com/api/auth?endpoint=login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                email,
                password,
              }),
            });

            const data = await response.json();

            if (response.ok) {
              localStorage.setItem('token', data.data.token);
              this.user = data.data.user;
              return data;
            } else {
              throw new Error(data.message || 'Login failed');
            }
          } catch (error) {
            console.error('Login error:', error);
            throw error;
          }
        },
        
        logout: function() {
          localStorage.removeItem('token');
          this.user = null;
        },
        
        getCurrentUser: async function() {
          try {
            const token = localStorage.getItem('token');
            if (!token) return null;

            const response = await fetch('https://skbakers.com/api/auth?endpoint=getCurrentUser', {
              method: 'GET',
              headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
            });

            if (response.ok) {
              const data = await response.json();
              this.user = data.data;
              return data.data;
            } else {
              localStorage.removeItem('token');
              this.user = null;
              return null;
            }
          } catch (error) {
            console.error('Error getting current user:', error);
            localStorage.removeItem('token');
            this.user = null;
            return null;
          }
        }
      };
      
      // Make it available globally
      window.useAuth = function() {
        return window.AuthContext;
      };
      
      console.log('AuthContext loaded and available globally');
    </script>

              console.log('🖼️ DOM loaded, loading banners...');
              await loadBanners();
            });
          } else {
            cleanupUnwantedElements();
            console.log('🖼️ DOM already loaded, loading banners...');
            loadBanners();
          }
          
          // Also load banners on window load
          window.addEventListener('load', async () => {
            cleanupUnwantedElements();
            console.log('🖼️ Window loaded, loading banners...');
            await loadBanners();
          });
          
          // Load banners after a short delay to ensure React app is ready
          setTimeout(() => {
            console.log('🖼️ Delayed banner load...');
            loadBanners();
          }, 2000);
          
          // Load banners when user navigates (for SPA behavior)
          window.addEventListener('popstate', () => {
            console.log('🖼️ Navigation detected, reloading banners...');
            setTimeout(loadBanners, 500);
          });
        }
        
        // Initialize event handlers
        initializeEventHandlers();
        
        // Add banner refresh button for testing (only in development)
        if (window.location.hostname === 'skbakers.com' || window.location.hostname === 'localhost') {
          const refreshButton = document.createElement('button');
          refreshButton.innerHTML = '🔄 Refresh Banners';
          refreshButton.style.cssText = `
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
          `;
          refreshButton.onclick = () => {
            console.log('🔄 Manual banner refresh triggered');
            loadBanners();
          };
          // Only append if body exists
          if (document.body) {
            document.body.appendChild(refreshButton);
          } else {
            // Wait for body to be available
            document.addEventListener('DOMContentLoaded', function() {
              if (document.body) {
                document.body.appendChild(refreshButton);
              }
            });
          }
          
          // Add banner test button
          const testButton = document.createElement('button');
          testButton.innerHTML = '🧪 Test Banner API';
          testButton.style.cssText = `
            position: fixed;
            top: 50px;
            right: 10px;
            z-index: 9999;
            background: #059669;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
          `;
          testButton.onclick = async () => {
            console.log('🧪 Testing banner API...');
            try {
              const response = await fetch('https://skbakers.com/api/banners/active');
              console.log('🧪 Banner API Response Status:', response.status);
              const data = await response.json();
              console.log('🧪 Banner API Response Data:', data);
              alert(`Banner API Test:\nStatus: ${response.status}\nBanners: ${data.data?.banners?.length || 0}`);
            } catch (error) {
              console.error('🧪 Banner API Test Error:', error);
              alert(`Banner API Test Failed:\n${error.message}`);
            }
          };
          
          // Only append if body exists
          if (document.body) {
            document.body.appendChild(testButton);
          } else {
            // Wait for body to be available
            document.addEventListener('DOMContentLoaded', function() {
              if (document.body) {
                document.body.appendChild(testButton);
              }
            });
          }
        }
        
        // Add duplicate form submission prevention
        function preventDuplicateSubmissions() {
          const forms = document.querySelectorAll('form');
          forms.forEach(form => {
            let isSubmitting = false;
            
            form.addEventListener('submit', function(e) {
              if (isSubmitting) {
                e.preventDefault();
                console.log('⚠️ Form submission prevented - already in progress');
                return false;
              }
              
              isSubmitting = true;
              console.log('🔄 Form submission started');
              
              // Reset flag after 5 seconds
              setTimeout(() => {
                isSubmitting = false;
                console.log('✅ Form submission flag reset');
              }, 5000);
            });
          });
        }
        
        // Initialize duplicate prevention
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', preventDuplicateSubmissions);
        } else {
          preventDuplicateSubmissions();
        }
        
        console.log('✅ Banner Display Fix Initialized');
      })();
    </script>
