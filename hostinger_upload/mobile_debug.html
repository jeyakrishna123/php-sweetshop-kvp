<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Debug - SK Bakers</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        .test-item { margin: 15px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .warning { background: #fff3cd; border-color: #ffeaa7; }
        .info { background: #d1ecf1; border-color: #bee5eb; }
        button { background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; margin: 10px 0; }
        .debug-output { background: #f8f9fa; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Mobile Debug - SK Bakers</h1>
        <p>This will help identify the exact mobile issue.</p>
        
        <div class="test-item info">
            <h3>📱 Device Info</h3>
            <div id="device-info"></div>
        </div>
        
        <div class="test-item">
            <h3>🌐 Network Test</h3>
            <button onclick="testNetwork()">Test Network</button>
            <div id="network-result"></div>
        </div>
        
        <div class="test-item">
            <h3>🔗 API Test</h3>
            <button onclick="testAPI()">Test API Calls</button>
            <div id="api-result"></div>
        </div>
        
        <div class="test-item">
            <h3>📄 Main Website Test</h3>
            <button onclick="testMainWebsite()">Test Main Website</button>
            <div id="main-result"></div>
        </div>
        
        <div class="test-item">
            <h3>🔧 JavaScript Test</h3>
            <button onclick="testJavaScript()">Test JavaScript</button>
            <div id="js-result"></div>
        </div>
        
        <div class="test-item">
            <h3>📊 Debug Output</h3>
            <div id="debug-output" class="debug-output"></div>
        </div>
    </div>

    <script>
        let debugLog = [];
        
        function log(message) {
            debugLog.push(new Date().toLocaleTimeString() + ': ' + message);
            document.getElementById('debug-output').innerHTML = debugLog.join('<br>');
            console.log(message);
        }
        
        function displayDeviceInfo() {
            const deviceInfo = document.getElementById('device-info');
            deviceInfo.innerHTML = `
                <p><strong>User Agent:</strong> ${navigator.userAgent}</p>
                <p><strong>Screen:</strong> ${screen.width}x${screen.height}</p>
                <p><strong>Window:</strong> ${window.innerWidth}x${window.innerHeight}</p>
                <p><strong>Touch:</strong> ${('ontouchstart' in window) ? 'Yes' : 'No'}</p>
                <p><strong>Platform:</strong> ${navigator.platform}</p>
                <p><strong>Connection:</strong> ${navigator.connection ? navigator.connection.effectiveType : 'Unknown'}</p>
            `;
            log('Device info displayed');
        }
        
        async function testNetwork() {
            const result = document.getElementById('network-result');
            result.innerHTML = '<p>Testing network...</p>';
            log('Testing network connection');
            
            try {
                const response = await fetch('https://skbakers.com', { 
                    method: 'HEAD',
                    mode: 'no-cors'
                });
                result.innerHTML = '<div class="success">✅ Network OK</div>';
                log('Network test: SUCCESS');
            } catch (error) {
                result.innerHTML = `<div class="error">❌ Network Error: ${error.message}</div>`;
                log('Network test: FAILED - ' + error.message);
            }
        }
        
        async function testAPI() {
            const result = document.getElementById('api-result');
            result.innerHTML = '<p>Testing API...</p>';
            log('Testing API endpoints');
            
            const endpoints = [
                'https://skbakers.com/api/products',
                'https://skbakers.com/api/categories',
                'https://skbakers.com/api/banners/active'
            ];
            
            let results = [];
            
            for (const url of endpoints) {
                try {
                    log('Testing: ' + url);
                    const response = await fetch(url);
                    if (response.ok) {
                        results.push(`✅ ${url}: ${response.status}`);
                        log('API SUCCESS: ' + url + ' - ' + response.status);
                    } else {
                        results.push(`⚠️ ${url}: ${response.status}`);
                        log('API WARNING: ' + url + ' - ' + response.status);
                    }
                } catch (error) {
                    results.push(`❌ ${url}: ${error.message}`);
                    log('API ERROR: ' + url + ' - ' + error.message);
                }
            }
            
            result.innerHTML = results.map(r => `<div>${r}</div>`).join('');
        }
        
        async function testMainWebsite() {
            const result = document.getElementById('main-result');
            result.innerHTML = '<p>Testing main website...</p>';
            log('Testing main website load');
            
            try {
                const response = await fetch('https://skbakers.com');
                if (response.ok) {
                    const html = await response.text();
                    if (html.includes('SK BAKERS')) {
                        result.innerHTML = '<div class="success">✅ Main website loads correctly</div>';
                        log('Main website: SUCCESS - Contains SK BAKERS');
                    } else {
                        result.innerHTML = '<div class="warning">⚠️ Main website loads but content missing</div>';
                        log('Main website: WARNING - Missing content');
                    }
                } else {
                    result.innerHTML = `<div class="error">❌ Main website error: ${response.status}</div>`;
                    log('Main website: ERROR - ' + response.status);
                }
            } catch (error) {
                result.innerHTML = `<div class="error">❌ Main website error: ${error.message}</div>`;
                log('Main website: ERROR - ' + error.message);
            }
        }
        
        function testJavaScript() {
            const result = document.getElementById('js-result');
            let tests = [];
            
            // Test basic JavaScript
            tests.push('✅ JavaScript working');
            log('JavaScript test: Basic functionality OK');
            
            // Test fetch API
            if (typeof fetch !== 'undefined') {
                tests.push('✅ Fetch API available');
                log('JavaScript test: Fetch API available');
            } else {
                tests.push('❌ Fetch API not available');
                log('JavaScript test: Fetch API missing');
            }
            
            // Test localStorage
            try {
                localStorage.setItem('test', 'value');
                localStorage.removeItem('test');
                tests.push('✅ Local storage available');
                log('JavaScript test: Local storage OK');
            } catch (e) {
                tests.push('❌ Local storage not available');
                log('JavaScript test: Local storage FAILED');
            }
            
            // Test mobile-specific features
            if ('ontouchstart' in window) {
                tests.push('✅ Touch events supported');
                log('JavaScript test: Touch events OK');
            } else {
                tests.push('❌ Touch events not supported');
                log('JavaScript test: Touch events missing');
            }
            
            result.innerHTML = tests.map(test => `<div>${test}</div>`).join('');
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            log('Mobile debug page loaded');
            displayDeviceInfo();
        });
    </script>
</body>
</html>
